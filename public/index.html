<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lemon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* 顶部栏 */
    .header {
      background: #111;
      border-bottom: 1px solid #222;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #f7d046, #e6a817);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .header-text h1 { font-size: 18px; color: #fff; }
    .header-text p { font-size: 12px; color: #888; }
    /* 聊天区域 */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.bot {
      align-self: flex-start;
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-bottom-left-radius: 4px;
    }
    .message.user {
      align-self: flex-end;
      background: #f7d046;
      color: #000;
      border-bottom-right-radius: 4px;
    }
    .message.bot .name { color: #f7d046; font-size: 12px; margin-bottom: 4px; }
    .message.user .name { color: #666; font-size: 12px; margin-bottom: 4px; text-align: right; }
    /* 输入区域 */
    .input-area {
      background: #111;
      border-top: 1px solid #222;
      padding: 16px 20px;
      display: flex;
      gap: 12px;
    }
    .input-area input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 24px;
      padding: 12px 20px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus { border-color: #f7d046; }
    .input-area input::placeholder { color: #555; }
    .input-area button {
      background: linear-gradient(135deg, #f7d046, #e6a817);
      border: none;
      border-radius: 50%;
      width: 46px; height: 46px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .input-area button:active { transform: scale(0.95); }
    .input-area button svg { width: 20px; height: 20px; fill: #000; }
    /* 加载动画 */
    .typing { display: flex; gap: 4px; padding: 8px 0; }
    .typing span {
      width: 8px; height: 8px;
      background: #f7d046;
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🍋</div>
    <div class="header-text">
      <h1>AI Lemon</h1>
      <p>智能助手 · 在线</p >
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="message bot">
      <div class="name">Lemon</div>
      <div class="text">你好！我是 Lemon，有什么可以帮你的？</div>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="输入你的问题..." autocomplete="off">
    <button onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    let sessionId = 'sess_' + Math.random().toString(36).substr(2, 16);
    let isWaiting = false;

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'message ' + type;
      const nameDiv = document.createElement('div');
      nameDiv.className = 'name';
      nameDiv.textContent = type === 'bot' ? 'Lemon' : '你';
      const textDiv = document.createElement('div');
      textDiv.className = 'text';
      textDiv.textContent = text;
      div.appendChild(nameDiv);
      div.appendChild(textDiv);
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return textDiv;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typing-indicator';
      div.innerHTML = '<div class="name">Lemon</div><div class="typing"><span></span><span></span><span></span></div>';
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isWaiting) return;

      isWaiting = true;
      userInput.value = '';
      addMessage(text, 'user');
      showTyping();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId })
        });

        removeTyping();

        if (!response.ok) throw new Error('请求失败');

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        const botTextDiv = addMessage('', 'bot');
        let fullText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (line.startsWith('data:')) {
              const data = line.slice(5).trim();
              if (data === '[DONE]') continue;
              try {
                const parsed = JSON.parse(data);
                if (parsed.content) {
                  fullText += parsed.content;
                  botTextDiv.textContent = fullText;
                  chatArea.scrollTop = chatArea.scrollHeight;
                }
              } catch (e) {}
            }
          }
        }

        if (!fullText) {
          botTextDiv.textContent = '抱歉，出了点问题，请重试。';
        }
      } catch (err) {
        removeTyping();
        addMessage('网络连接失败，请稍后重试。', 'bot');
      }

      isWaiting = false;
      userInput.focus();
    }
  </script>
</body>
</html>
